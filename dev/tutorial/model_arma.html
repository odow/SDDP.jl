<!DOCTYPE html>
<head>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/elkjs@0.9.3/lib/elk.bundled.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape-elk@2.1.0/dist/cytoscape-elk.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/layout-base/layout-base.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cose-base/cose-base.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape-fcose/cytoscape-fcose.js"></script>
  <style>
    #cy {width: 100vw; height: 100vh;}
    #tooltip {
      position: absolute;
      display: none;
      background: rgba(30, 30, 30, 0.9);
      color: #fff;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 13px;
      pointer-events: none;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
      z-index: 999;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <div id="cy"></div>
  <div id="tooltip"></div>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const tooltip = document.getElementById('tooltip');
      const squigglyPhotonSvg = `data:image/svg+xml;utf8,` + encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
          <path d="M 5,5 Q 15,2 20,12 T 35,20 L 44,32" fill="none" stroke="#000" stroke-width="2"/>
          <polygon points="48,36 38,33 44,25" fill="#000"/>
        </svg>
      `);
      const cy = cytoscape({
        container: document.getElementById('cy'),
        elements: [
          {data: {id: '(0, 0.0)', shape: 'ellipse', meta: 'x = 200.0'}},
{data: {id: '(1, 51.02901305752114)', meta: 'Node: (1, 51.02901305752114)\nNoise terms: 1'}},
{data: {id: '(2, 48.26373871666859)', meta: 'Node: (2, 48.26373871666859)\nNoise terms: 1'}},
{data: {id: '(2, 59.7)', meta: 'Node: (2, 59.7)\nNoise terms: 1'}},
{data: {id: '(2, 69.2)', meta: 'Node: (2, 69.2)\nNoise terms: 1'}},
{data: {id: '(3, 47.385661957627285)', meta: 'Node: (3, 47.385661957627285)\nNoise terms: 1'}},
{data: {id: '(3, 49.701761493103376)', meta: 'Node: (3, 49.701761493103376)\nNoise terms: 1'}},
{data: {id: '(3, 59.202646725313286)', meta: 'Node: (3, 59.202646725313286)\nNoise terms: 1'}},
{data: {id: '(3, 75.84320200023627)', meta: 'Node: (3, 75.84320200023627)\nNoise terms: 1'}},
{data: {id: 'edge_1', source: '(0, 0.0)', target: '(1, 51.02901305752114)', meta: 'From: (0, 0.0)\nTo: (1, 51.02901305752114)\nProbablity: 1.0'}},
{data: {id: 'edge_2', source: '(1, 51.02901305752114)', target: '(2, 59.7)', meta: 'From: (1, 51.02901305752114)\nTo: (2, 59.7)\nProbablity: 0.3'}},
{data: {id: 'edge_3', source: '(1, 51.02901305752114)', target: '(2, 48.26373871666859)', meta: 'From: (1, 51.02901305752114)\nTo: (2, 48.26373871666859)\nProbablity: 0.6'}},
{data: {id: 'edge_4', source: '(1, 51.02901305752114)', target: '(2, 69.2)', meta: 'From: (1, 51.02901305752114)\nTo: (2, 69.2)\nProbablity: 0.1'}},
{data: {id: 'edge_5', source: '(2, 48.26373871666859)', target: '(3, 47.385661957627285)', meta: 'From: (2, 48.26373871666859)\nTo: (3, 47.385661957627285)\nProbablity: 0.5'}},
{data: {id: 'edge_6', source: '(2, 48.26373871666859)', target: '(3, 49.701761493103376)', meta: 'From: (2, 48.26373871666859)\nTo: (3, 49.701761493103376)\nProbablity: 0.2222222222222222'}},
{data: {id: 'edge_7', source: '(2, 48.26373871666859)', target: '(3, 59.202646725313286)', meta: 'From: (2, 48.26373871666859)\nTo: (3, 59.202646725313286)\nProbablity: 0.2777777777777778'}},
{data: {id: 'edge_8', source: '(2, 48.26373871666859)', target: '(3, 75.84320200023627)', meta: 'From: (2, 48.26373871666859)\nTo: (3, 75.84320200023627)\nProbablity: 0.0'}},
{data: {id: 'edge_9', source: '(2, 59.7)', target: '(3, 47.385661957627285)', meta: 'From: (2, 59.7)\nTo: (3, 47.385661957627285)\nProbablity: 0.1111111111111111'}},
{data: {id: 'edge_10', source: '(2, 59.7)', target: '(3, 49.701761493103376)', meta: 'From: (2, 59.7)\nTo: (3, 49.701761493103376)\nProbablity: 0.5555555555555556'}},
{data: {id: 'edge_11', source: '(2, 59.7)', target: '(3, 59.202646725313286)', meta: 'From: (2, 59.7)\nTo: (3, 59.202646725313286)\nProbablity: 0.1111111111111111'}},
{data: {id: 'edge_12', source: '(2, 59.7)', target: '(3, 75.84320200023627)', meta: 'From: (2, 59.7)\nTo: (3, 75.84320200023627)\nProbablity: 0.2222222222222222'}},
{data: {id: 'edge_13', source: '(2, 69.2)', target: '(3, 47.385661957627285)', meta: 'From: (2, 69.2)\nTo: (3, 47.385661957627285)\nProbablity: 0.0'}},
{data: {id: 'edge_14', source: '(2, 69.2)', target: '(3, 49.701761493103376)', meta: 'From: (2, 69.2)\nTo: (3, 49.701761493103376)\nProbablity: 0.0'}},
{data: {id: 'edge_15', source: '(2, 69.2)', target: '(3, 59.202646725313286)', meta: 'From: (2, 69.2)\nTo: (3, 59.202646725313286)\nProbablity: 0.6666666666666666'}},
{data: {id: 'edge_16', source: '(2, 69.2)', target: '(3, 75.84320200023627)', meta: 'From: (2, 69.2)\nTo: (3, 75.84320200023627)\nProbablity: 0.3333333333333333'}},
        ],
        layout: {
          name: 'elk',
          elk: {
            'algorithm': 'layered',
            'elk.layered.wrapping.strategy': 'MULTI_EDGE',
            'elk.layered.cycleBreaking.strategy': 'MODEL_ORDER',
            'elk.aspectRatio': 2,
            'elk.layered.spacing.nodeNodeBetweenLayers': 30,
            'elk.spacing.nodeNode': 100,
            'elk.spacing.edgeEdge': 20,
            'elk.spacing.edgeNode': 50
          }
        },
        style: [{
          selector: 'node',
          style: {
            'shape': 'rectangle',
            'background-color': '#fff',
            'border-width': 1,
            'text-valign': 'center',
            'text-halign': 'center',
          }
        }, {
          selector: 'edge',
          style: {
            'width': 1,
            'line-color': '#000',
            'curve-style': 'bezier',
            'target-arrow-shape': 'triangle',
            'target-arrow-color': '#000',
          },
        }, {
          selector: 'node[shape]', style: {'shape': 'data(shape)'}
        }, {
          selector: 'node[?has_noise]',
          style: {
            'background-image': squigglyPhotonSvg,
            'background-clip': 'none',
            'bounds-expansion': 30,
            'background-position-x': '-30px',
            'background-position-y': '-25px',
            'background-width': '45px',
            'background-height': '45px',
            'background-repeat': 'no-repeat'
          }
        }]
      });
      function showTooltip(evt) {
        if (evt.target.data('meta')) {
          tooltip.innerText = evt.target.data('meta');
          tooltip.style.display = 'block';
          tooltip.style.left = evt.renderedPosition.x + 15 + 'px';
          tooltip.style.top = evt.renderedPosition.y + 15 + 'px';
        }
      }
      function moveTooltip(evt) {
        if (tooltip.style.display === 'block') {
          tooltip.style.left = evt.renderedPosition.x + 15 + 'px';
          tooltip.style.top = evt.renderedPosition.y + 15 + 'px';
        }
      }
      function hideTooltip() {
        tooltip.style.display = 'none';
      }
      cy.on('mouseover', 'node, edge', showTooltip);
      cy.on('mousemove', 'node, edge', moveTooltip);
      cy.on('mouseout', 'node, edge', hideTooltip);
    });
  </script>
</body>
</html>
