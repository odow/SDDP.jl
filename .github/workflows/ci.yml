name: CI
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # SDDP doesn't have any binary dependencies, so just test on Linux, LTS
        # and current release.
        include:
          - version: '1.10'
            os: ubuntu-latest
            arch: x64
          - version: '1'
            os: ubuntu-latest
            arch: x64
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@latest
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          JULIA_NUM_THREADS: 4
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
  jade:
    name: JADE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'
          arch: x64
      - uses: julia-actions/cache@v3
      # models/JADE has its own project. Develop the SDDP.jl checkout into it so
      # the tests run against this commit, not the registered release.
      - name: Install
        shell: julia --color=yes --project=models/JADE {0}
        run: |
          import Pkg
          Pkg.develop(; path = ".")
          Pkg.instantiate()
      - name: Test
        run: julia --color=yes --project=models/JADE models/JADE/runtests.jl
